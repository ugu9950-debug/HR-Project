<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채용현황 대시보드</title>
<style>
  :root{
    --bg:#F5F6FA;
    --surface:#FFFFFF;
    --ink:#1C2333;
    --ink-soft:#6B7280;
    --line:#E5E7EE;
    --brand:#33456B;
    --brand-soft:#EDF0F7;
    --danger:#D64545;

    --s1:#94A3B8; /* 공고중 */
    --s2:#4C8DFF; /* 서류전형 */
    --s3:#22B8A0; /* 1차면접 */
    --s4:#F0AA2E; /* 2차면접 */
    --s5:#F0793C; /* 처우협의 */
    --s6:#4FB8E0; /* 건강검진 */
    --s7:#8B6BD8; /* 입사예정 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .wrap{max-width:1600px;margin:0 auto;padding:28px 32px 60px;}

  header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .title-block h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-0.3px;}
  .title-block p{margin:0;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#B0B4C0;display:inline-block;}
  .status-dot.ok{background:#22B8A0;}
  .status-dot.err{background:var(--danger);}
  .header-actions{display:flex;gap:8px;align-items:center;}
  .btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--brand);color:var(--brand);}
  .btn-primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn-primary:hover{opacity:.9;color:#fff;}
  .btn:disabled{opacity:.5;cursor:default;}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat .num{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
  .stat .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat.accent .num{color:var(--brand);}

  .filterbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .filterbar select, .filterbar input[type=text]{
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;
    background:var(--surface);color:var(--ink);min-width:110px;
  }
  .filterbar .meta{margin-left:auto;font-size:12px;color:var(--ink-soft);}

  .board{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:start;}
  .col{background:#EEF0F5;border-radius:14px;padding:9px;min-height:120px;}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:5px 5px 9px;}
  .col-head .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
  .col-head .name{font-size:12.5px;font-weight:700;}
  .col-head .count{font-size:11.5px;color:var(--ink-soft);background:#fff;border-radius:20px;padding:1px 7px;}
  .sort-toggle{
    width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:#fff;
    color:var(--ink-soft);font-size:11px;line-height:1;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;padding:0;transition:.15s;
  }
  .sort-toggle:hover{border-color:var(--brand);color:var(--brand);}
  .sort-toggle.active{background:var(--brand);border-color:var(--brand);color:#fff;}

  .card{
    background:var(--surface);border-radius:10px;padding:11px 12px;margin-bottom:8px;
    border:1px solid var(--line);border-top:3px solid var(--stage-color,var(--brand));
    box-shadow:0 1px 2px rgba(20,20,40,0.03);
  }
  .card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
  .card .tag{
    font-size:10px;background:var(--brand-soft);color:var(--brand);
    padding:2px 6px;border-radius:6px;font-weight:600;
  }
  .card .tag.group{background:#F3ECFB;color:#7A4FC4;}
  .card .tag.channel{background:#EAF7F0;color:#1F9D5A;}
  .card .tag.dday{background:#FDEDEA;color:#C4432E;}
  .card .pos{font-size:13px;font-weight:700;margin-bottom:6px;line-height:1.3;}
  .card .field{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .card .field b{color:var(--ink);font-weight:600;}
  .card .stage-block{
    margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);
  }
  .card .stage-label{font-size:10px;font-weight:700;color:var(--stage-color,var(--brand));text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;}
  .card .note{margin-top:7px;font-size:10.5px;color:#8A8FA3;border-top:1px dashed var(--line);padding-top:5px;}
  .progress-track{display:flex;gap:3px;margin-top:8px;}
  .progress-track span{flex:1;height:4px;border-radius:2px;background:#E4E6EE;}
  .progress-track span.done{background:var(--stage-color,var(--brand));}

  .empty{
    background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;
    padding:50px 30px;text-align:center;margin-top:10px;
  }
  .empty h2{font-size:17px;margin:14px 0 6px;}
  .empty p{color:var(--ink-soft);font-size:13.5px;margin:0 0 10px;line-height:1.6;}
  .empty code{
    display:block;background:#F0F1F5;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:12px;text-align:left;color:var(--brand);margin:14px auto;max-width:640px;
    word-break:break-all;
  }
  .empty.err{border-color:#F3C7C7;}
  .empty.err h2{color:var(--danger);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  @media (max-width: 1400px){
    .board{grid-template-columns:repeat(4,1fr);}
    .summary{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width: 900px){
    .board{grid-template-columns:repeat(2,1fr);}
    .summary{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width: 600px){
    .board{grid-template-columns:1fr;}
    .wrap{padding:18px 14px 40px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>채용현황 대시보드</h1>
      <p><span class="status-dot" id="statusDot"></span><span id="subline">연결 대기 중...</span></p>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="refreshBtn">새로고침</button>
    </div>
  </header>

  <div id="content"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   설정: 아래 SCRIPT_URL에 Google Apps Script 웹앱 배포 URL을
   붙여넣으세요. (예: https://script.google.com/macros/s/AKfycb.../exec)
   설정 방법은 함께 드린 "Google_Sheets_연동_가이드" 파일을 참고하세요.
   ========================================================= */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw0f6VKkzhZT1fT5skMpYGH_z3p5YnYNaPK5aDPGfcrFdYhVR5URBSw2K1ONgrHUCAIzw/exec", // 여기에 Apps Script 웹앱 URL을 입력하세요
};

const STAGES = ["공고중","서류전형","1차면접","2차면접","처우협의","건강검진","입사예정"];
const STAGE_COLORS = {
  "공고중":"var(--s1)","서류전형":"var(--s2)","1차면접":"var(--s3)","2차면접":"var(--s4)",
  "처우협의":"var(--s5)","건강검진":"var(--s6)","입사예정":"var(--s7)","기타":"#B0B4C0"
};
const PROGRESS_GROUPS = ["진행예정","진행중","보류","입사예정","종료"];

let state = { records: [], updatedAt: null };
let filters = { hq:"", dept:"", progressGroup:"", search:"" };
let sortOrders = {}; // { [stage]: null | "desc"(최신순) | "asc"(오래된순) }

const $ = (sel) => document.querySelector(sel);
const contentEl = $("#content");
const subline = $("#subline");
const statusDot = $("#statusDot");
const toastEl = $("#toast");
const refreshBtn = $("#refreshBtn");

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), 2400);
}

function setStatus(kind, text){
  statusDot.className = "status-dot" + (kind ? " " + kind : "");
  subline.textContent = text;
}

function normalizeStage(v){
  if(!v) return "기타";
  const t = String(v).trim();
  return STAGES.includes(t) ? t : "기타";
}

/* ---------- 날짜 유틸 ---------- */
function parseDate(s){
  if(!s) return null;
  const str = String(s).trim();

  // Apps Script가 Date 객체를 그대로 직렬화했을 때 나오는 전체 ISO 타임스탬프
  // (예: 2026-07-28T15:00:00.000Z). 시트 타임존(Asia/Seoul 가정)의 달력 날짜로 환산한다.
  if(/^\d{4}-\d{2}-\d{2}T/.test(str)){
    const d = new Date(str);
    if(isNaN(d.getTime())) return null;
    try{
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(d);
      const y = parts.find(p=>p.type==="year").value;
      const mo = parts.find(p=>p.type==="month").value;
      const da = parts.find(p=>p.type==="day").value;
      return new Date(+y, +mo-1, +da);
    }catch(e){
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
  }

  const m = str.match(/^(\d{4})[.\-\/\s]+(\d{1,2})[.\-\/\s]+(\d{1,2})/);
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d.getTime()) ? null : d;
}
function toYMD(d){
  const y = d.getFullYear();
  const mo = String(d.getMonth()+1).padStart(2,"0");
  const da = String(d.getDate()).padStart(2,"0");
  return `${y}-${mo}-${da}`;
}
/* 카드에 표시할 날짜: 파싱 가능하면 yyyy-mm-dd로 통일, 안 되면 원본 값 그대로 표시 */
function fmtD(s){
  if(!s) return "";
  const d = parseDate(s);
  return d ? toYMD(d) : String(s).trim();
}
function todayMidnight(){
  const d = new Date(); d.setHours(0,0,0,0); return d;
}
function dDayLabel(dateStr){
  const d = parseDate(dateStr);
  if(!d) return "";
  const diff = Math.round((d - todayMidnight()) / 86400000);
  if(diff === 0) return "D-day";
  return diff > 0 ? `D-${diff}` : `D+${-diff}`;
}
function elapsedDaysLabel(dateStr){
  const d = parseDate(dateStr);
  if(!d) return "";
  const diff = Math.round((todayMidnight() - d) / 86400000);
  if(diff < 0) return "";
  return `요청 후 ${diff}일 경과`;
}

/* 진행 단계별로 가장 의미 있는 날짜를 정렬 기준으로 사용 */
function getSortDate(r){
  let raw;
  switch(r.stage){
    case "공고중": raw = r.postDate || r.requestDate; break;
    case "서류전형": raw = r.deadlineDate || r.requestDate; break;
    case "1차면접": raw = r.interviewDate1 || r.requestDate; break;
    case "2차면접": raw = r.interviewDate2 || r.interviewDate1 || r.requestDate; break;
    case "처우협의": raw = r.hireDate || r.interviewDate2 || r.requestDate; break;
    case "건강검진": raw = r.hireDate || r.requestDate; break;
    case "입사예정": raw = r.hireDate || r.requestDate; break;
    default: raw = r.requestDate;
  }
  return parseDate(raw);
}

function sortItems(items, stage){
  const order = sortOrders[stage];
  if(!order) return items;
  const withDate = [];
  const withoutDate = [];
  items.forEach(r => {
    const d = getSortDate(r);
    if(d) withDate.push({ r, d }); else withoutDate.push(r);
  });
  withDate.sort((a,b) => order === "desc" ? b.d - a.d : a.d - b.d);
  return [...withDate.map(x=>x.r), ...withoutDate];
}

function renderSetupNeeded(){
  contentEl.innerHTML = `
    <div class="empty err">
      <div style="font-size:34px;">⚙️</div>
      <h2>Google Sheets 연동이 설정되지 않았습니다</h2>
      <p>이 HTML 파일 상단의 <b>CONFIG.SCRIPT_URL</b> 값에 Google Apps Script 웹앱 배포 URL을 입력해야 합니다.</p>
      <code>const CONFIG = { SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw0f6VKkzhZT1fT5skMpYGH_z3p5YnYNaPK5aDPGfcrFdYhVR5URBSw2K1ONgrHUCAIzw/exec" }</code>
      <p>설정 방법은 함께 전달드린 "Google_Sheets_연동_가이드" 문서를 참고해 주세요.</p>
    </div>
  `;
}

function renderFetchError(message){
  contentEl.innerHTML = `
    <div class="empty err">
      <div style="font-size:34px;">⚠️</div>
      <h2>데이터를 불러오지 못했습니다</h2>
      <p>${escapeHtml(message)}</p>
      <p style="font-size:12px;">Apps Script 배포 상태(액세스 권한: 전체 허용)와 URL을 확인한 뒤 새로고침해 주세요.</p>
      <button class="btn btn-primary" id="retryBtn">다시 시도</button>
    </div>
  `;
  const retry = document.getElementById("retryBtn");
  if(retry) retry.addEventListener("click", loadData);
}

async function loadData(){
  if(!CONFIG.SCRIPT_URL){
    setStatus("err", "설정 필요");
    renderSetupNeeded();
    return;
  }
  refreshBtn.disabled = true;
  setStatus("", "불러오는 중...");
  try{
    const res = await fetch(CONFIG.SCRIPT_URL, { method:"GET" });
    if(!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
    const json = await res.json();
    const rawRows = Array.isArray(json) ? json : (json.records || []);

    const records = rawRows
      .map(r => ({
        progressGroup: String(r["진행 구분"] || "").trim(),
        hq: String(r["본부"] || "").trim(),
        dept: String(r["부서"] || "").trim(),
        position: String(r["요청 직무"] || "").trim(),
        level: String(r["요청직급"] || "").trim(),
        reason: String(r["채용사유"] || "").trim(),
        reannounce: String(r["재공고 여부"] || "").trim(),
        requestDate: String(r["채용 요청일"] || "").trim(),
        postDate: String(r["공고 게시일"] || "").trim(),
        deadlineDate: String(r["공고 마감일"] || "").trim(),
        leadTime: String(r["리드타임"] || "").trim(),
        stage: normalizeStage(r["진행 상태"]),
        candidate1: String(r["후보자(1차)"] || "").trim(),
        interviewDate1: String(r["면접일(1차)"] || "").trim(),
        interviewer1: String(r["면접관(1차)"] || "").trim(),
        candidate2: String(r["후보자(2차)"] || "").trim(),
        interviewDate2: String(r["면접일(2차)"] || "").trim(),
        interviewer2: String(r["면접관(2차)"] || "").trim(),
        candidateFinal: String(r["후보자(최종)"] || "").trim(),
        hireDate: String(r["입사예정일"] || "").trim(),
        channel: String(r["채용경로"] || "").trim(),
        note: String(r["비고"] || "").trim(),
      }))
      .filter(r => r.position);

    state = { records, updatedAt: new Date() };
    setStatus("ok", `연결됨 · 최근 동기화 ${state.updatedAt.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}`);
    render();
  }catch(err){
    console.error(err);
    setStatus("err", "연결 실패");
    renderFetchError(err.message || "네트워크 오류가 발생했습니다.");
  }finally{
    refreshBtn.disabled = false;
  }
}

function getFiltered(){
  return state.records.filter(r => {
    if(filters.hq && r.hq !== filters.hq) return false;
    if(filters.dept && r.dept !== filters.dept) return false;
    if(filters.progressGroup && r.progressGroup !== filters.progressGroup) return false;
    if(filters.search){
      const q = filters.search.toLowerCase();
      const hay = [r.position, r.candidate1, r.candidate2, r.candidateFinal, r.interviewer1, r.interviewer2].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  if(state.records.length === 0){
    contentEl.innerHTML = `
      <div class="empty">
        <div style="font-size:34px;">📋</div>
        <h2>구글시트에 등록된 채용 건이 없습니다</h2>
        <p>연동된 구글시트에 채용 데이터를 입력하면 여기에 자동으로 표시됩니다.</p>
      </div>
    `;
    return;
  }

  const all = state.records;
  const filtered = getFiltered();
  const hqs = [...new Set(all.map(r=>r.hq).filter(Boolean))].sort();
  const deptsForHq = [...new Set(all.filter(r=>!filters.hq || r.hq===filters.hq).map(r=>r.dept).filter(Boolean))].sort();
  const groupsPresent = PROGRESS_GROUPS.filter(g => all.some(r=>r.progressGroup===g));

  const now = new Date();
  const curYear = String(now.getFullYear());

  const completedThisYear = filtered.filter(r => r.progressGroup==="종료" && r.hireDate.startsWith(curYear)).length;
  const inProgressCount = filtered.filter(r => r.progressGroup==="진행중").length;
  const interviewingCount = filtered.filter(r=>r.stage==="1차면접"||r.stage==="2차면접").length;
  const finalizingCount = filtered.filter(r=>r.stage==="처우협의"||r.stage==="건강검진"||r.stage==="입사예정").length;

  contentEl.innerHTML = `
    <div class="summary">
      <div class="stat accent"><div class="num">${completedThisYear}</div><div class="label">채용 완료 건수 (${curYear}년)</div></div>
      <div class="stat"><div class="num">${inProgressCount}</div><div class="label">현재 진행 건수</div></div>
      <div class="stat"><div class="num">${interviewingCount}</div><div class="label">면접 진행 중 (1차·2차)</div></div>
      <div class="stat"><div class="num">${finalizingCount}</div><div class="label">채용 마무리 단계 (처우협의·건강검진·입사예정)</div></div>
    </div>

    <div class="filterbar">
      <select id="groupFilter">
        <option value="">전체 진행구분</option>
        ${groupsPresent.map(g=>`<option value="${g}" ${filters.progressGroup===g?"selected":""}>${g}</option>`).join("")}
      </select>
      <select id="hqFilter">
        <option value="">전체 본부</option>
        ${hqs.map(h=>`<option value="${h}" ${filters.hq===h?"selected":""}>${h}</option>`).join("")}
      </select>
      <select id="deptFilter">
        <option value="">전체 부서</option>
        ${deptsForHq.map(d=>`<option value="${d}" ${filters.dept===d?"selected":""}>${d}</option>`).join("")}
      </select>
      <input type="text" id="searchInput" placeholder="직무·후보자·면접관 검색" value="${filters.search}">
      <span class="meta">사이트 접속 시 또는 새로고침 버튼 클릭 시 동기화됩니다</span>
    </div>

    <div class="board">
      ${STAGES.map(stage => renderColumn(stage, filtered)).join("")}
    </div>
  `;

  $("#groupFilter").addEventListener("change", (e)=>{ filters.progressGroup = e.target.value; render(); });
  $("#hqFilter").addEventListener("change", (e)=>{ filters.hq = e.target.value; filters.dept=""; render(); });
  $("#deptFilter").addEventListener("change", (e)=>{ filters.dept = e.target.value; render(); });
  $("#searchInput").addEventListener("input", (e)=>{ filters.search = e.target.value; render(); });
}

function renderColumn(stage, records){
  const items = sortItems(records.filter(r => r.stage === stage), stage);
  const color = STAGE_COLORS[stage];
  const stageIdx = STAGES.indexOf(stage);
  const order = sortOrders[stage] || null;
  const sortIcon = order === "desc" ? "↓" : order === "asc" ? "↑" : "↕";
  const sortTitle = order === "desc" ? "최신순 정렬 중 (클릭: 오래된순)"
    : order === "asc" ? "오래된순 정렬 중 (클릭: 정렬 해제)"
    : "날짜순 정렬 (클릭: 최신순)";

  return `
    <div class="col">
      <div class="col-head">
        <div><span class="dot" style="background:${color}"></span><span class="name">${stage}</span></div>
        <div style="display:flex;align-items:center;gap:5px;">
          <button class="sort-toggle ${order ? 'active' : ''}" data-stage="${stage}" title="${sortTitle}">${sortIcon}</button>
          <span class="count">${items.length}</span>
        </div>
      </div>
      ${items.map(r => renderCard(r, color, stageIdx)).join("") || `<div style="text-align:center;color:var(--ink-soft);font-size:12px;padding:20px 0;">없음</div>`}
    </div>
  `;
}

/* ---------- 진행 단계별 맞춤 카드 본문 ---------- */
function renderStageBlock(r, color){
  switch(r.stage){
    case "공고중": {
      const dday = dDayLabel(r.deadlineDate);
      return `
        <div class="stage-block">
          ${r.postDate ? `<div class="field"><b>공고 게시일</b> ${escapeHtml(fmtD(r.postDate))}</div>` : ""}
          ${r.deadlineDate ? `<div class="field"><b>공고 마감일</b> ${escapeHtml(fmtD(r.deadlineDate))} ${dday ? `<span class="tag dday">${dday}</span>` : ""}</div>` : ""}
        </div>`;
    }
    case "서류전형": {
      const elapsed = elapsedDaysLabel(r.requestDate);
      return `
        <div class="stage-block">
          ${r.deadlineDate ? `<div class="field"><b>공고 마감일</b> ${escapeHtml(fmtD(r.deadlineDate))}</div>` : ""}
          ${elapsed ? `<div class="field">${elapsed}</div>` : ""}
        </div>`;
    }
    case "1차면접": {
      if(!r.candidate1) return "";
      return `
        <div class="stage-block">
          <div class="stage-label" style="--stage-color:${color}">1차 면접</div>
          <div class="field"><b>${escapeHtml(r.candidate1)}</b>${r.interviewer1 ? " · " + escapeHtml(r.interviewer1) : ""}${r.interviewDate1 ? " · " + escapeHtml(fmtD(r.interviewDate1)) : ""}</div>
        </div>`;
    }
    case "2차면접": {
      return `
        <div class="stage-block">
          ${r.candidate2 ? `
            <div class="stage-label" style="--stage-color:${color}">2차 면접</div>
            <div class="field"><b>${escapeHtml(r.candidate2)}</b>${r.interviewer2 ? " · " + escapeHtml(r.interviewer2) : ""}${r.interviewDate2 ? " · " + escapeHtml(fmtD(r.interviewDate2)) : ""}</div>
          ` : ""}
        </div>`;
    }
    case "처우협의": {
      const cand = r.candidateFinal || r.candidate2;
      return `
        <div class="stage-block">
          ${cand ? `<div class="field"><b>대상자</b> ${escapeHtml(cand)}</div>` : ""}
        </div>`;
    }
    case "건강검진": {
      return `
        <div class="stage-block">
          ${r.candidateFinal ? `<div class="field"><b>대상자</b> ${escapeHtml(r.candidateFinal)}</div>` : ""}
          ${r.hireDate ? `<div class="field"><b>입사예정일</b> ${escapeHtml(fmtD(r.hireDate))}</div>` : ""}
        </div>`;
    }
    case "입사예정": {
      const dday = dDayLabel(r.hireDate);
      return `
        <div class="stage-block">
          ${r.candidateFinal ? `<div class="field"><b>입사예정자</b> ${escapeHtml(r.candidateFinal)}</div>` : ""}
          ${r.hireDate ? `<div class="field"><b>입사예정일</b> ${escapeHtml(fmtD(r.hireDate))} ${dday ? `<span class="tag dday">${dday}</span>` : ""}</div>` : ""}
        </div>`;
    }
    default:
      return "";
  }
}

function renderCard(r, color, stageIdx){
  const metaBits = [];
  if(r.level) metaBits.push(r.level);
  if(r.reason) metaBits.push(r.reason);
  if(r.reannounce && /^(y|예|yes)$/i.test(r.reannounce)) metaBits.push("재공고");

  return `
    <div class="card" style="--stage-color:${color}">
      <div class="tags">
        ${r.progressGroup ? `<span class="tag group">${escapeHtml(r.progressGroup)}</span>` : ""}
        ${r.hq ? `<span class="tag">${escapeHtml(r.hq)}</span>` : ""}
        ${r.dept ? `<span class="tag">${escapeHtml(r.dept)}</span>` : ""}
        ${r.channel ? `<span class="tag channel">${escapeHtml(r.channel)}</span>` : ""}
      </div>
      <div class="pos">${escapeHtml(r.position)}${metaBits.length ? ` <span style="font-weight:400;color:var(--ink-soft);font-size:11px;">(${escapeHtml(metaBits.join(" · "))})</span>` : ""}</div>
      <div class="field"><b>요청일</b> ${escapeHtml(r.requestDate ? fmtD(r.requestDate) : "-")}</div>
      ${renderStageBlock(r, color)}
      ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : ""}
      <div class="progress-track">
        ${STAGES.map((s,i)=>`<span class="${i<=stageIdx?'done':''}" style="--stage-color:${color}"></span>`).join("")}
      </div>
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

refreshBtn.addEventListener("click", loadData);
contentEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".sort-toggle");
  if(!btn) return;
  const stage = btn.dataset.stage;
  const cur = sortOrders[stage] || null;
  sortOrders[stage] = cur === null ? "desc" : cur === "desc" ? "asc" : null;
  render();
});

loadData();
</script>
</body>
</html>
